<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAI KIRAN REDDY — Upload Work</title>

  <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .admin {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 22px;
      margin-top: 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #111;
      color: #fff;
      border: 1px solid #444;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    #adminPanel {
      display: none;
    }

    #loginMessage {
      margin-top: 12px;
    }

    #status {
      margin-top: 16px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<main class="admin">

  <h1>SAI KIRAN REDDY</h1>
  <p>Private Portfolio Upload</p>

  <section id="loginPanel" class="card">
    <h2>Admin Login</h2>
    <p>Only the website owner can upload work.</p>

    <button id="loginButton">
      Login
    </button>

    <p id="loginMessage"></p>
  </section>

  <section id="adminPanel" class="card">

    <h2>Upload New Work</h2>

    <label for="video">Select video</label>
    <input
      id="video"
      type="file"
      accept="video/*"
    >

    <label for="title">Project title</label>
    <input
      id="title"
      type="text"
      placeholder="Example: Cinematic Reel"
    >

    <label for="category">Category</label>
    <input
      id="category"
      type="text"
      placeholder="Example: Video Editing"
    >

    <button id="uploadButton">
      Upload Video
    </button>

    <p id="status"></p>

    <button id="logoutButton">
      Log Out
    </button>

  </section>

</main>

<script>

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const uploadButton = document.getElementById("uploadButton");
const status = document.getElementById("status");

function showLoggedOut() {
  loginPanel.style.display = "block";
  adminPanel.style.display = "none";
}

function showLoggedIn() {
  loginPanel.style.display = "none";
  adminPanel.style.display = "block";
}

if (window.netlifyIdentity) {

  window.netlifyIdentity.on("init", function(user) {

    if (user) {
      showLoggedIn();
    } else {
      showLoggedOut();
    }

  });

  loginButton.addEventListener("click", function() {

    window.netlifyIdentity.open("login");

  });

  logoutButton.addEventListener("click", function() {

    window.netlifyIdentity.logout();

  });

  window.netlifyIdentity.on("login", function() {

    showLoggedIn();

    window.netlifyIdentity.close();

  });

  window.netlifyIdentity.on("logout", function() {

    showLoggedOut();

  });

} else {

  status.textContent =
    "Login system could not load.";

}

uploadButton.addEventListener("click", async function() {

  const file =
    document.getElementById("video").files[0];

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value.trim();

  if (!file) {

    status.textContent =
      "Please choose a video.";

    return;

  }

  if (!title) {

    status.textContent =
      "Please enter a project title.";

    return;

  }

  status.textContent =
    "Uploading video...";

  const data = new FormData();

  data.append("file", file);

  data.append(
    "upload_preset",
    "portfolio_upload"
  );

  try {

    const response = await fetch(
      "https://api.cloudinary.com/v1_1/b7kikpfw/video/upload",
      {
        method: "POST",
        body: data
      }
    );

    const result =
      await response.json();

    if (!response.ok) {

      throw new Error(
        result.error?.message ||
        "Upload failed"
      );

    }

    status.innerHTML =
      "✅ Video uploaded successfully.<br><br>" +
      "Title: " + title + "<br>" +
      "Category: " + category + "<br><br>" +
      "Video URL:<br>" +
      result.secure_url;

  } catch (error) {

    status.textContent =
      "❌ Upload failed: " +
      error.message;

  }

});

</script>

</body>
</html>
